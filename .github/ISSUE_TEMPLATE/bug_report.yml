name: Bug report
description: Something in Review Pins does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste private source code, absolute paths, tokens or other secrets. A small made-up example is enough.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a Git folder\n2. Select lines in a saved file\n3. Add Question\n..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Review Pins 0.1.0, VS Code 1.xx, macOS/Windows/Linux"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pins and tree view, Code change detection, Copilot tools, Answers and verification, Copy / Handoff, Other]
